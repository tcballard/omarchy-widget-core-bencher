name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 tests/cleanup.py target/debug/omarchy-widget-core-bencher
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tcballard/omarchy-widget-core
          ref: 5cb38ff8c67fa03455dea154e951bce40458a301
          path: core-reference
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PySide6==6.11.2
      - run: cargo build --locked --manifest-path core-reference/Cargo.toml
      - run: python tests/package.py core-reference/target/debug/omarchy-widget
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
